<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>Ma Journée</title>
    <style>
      :root {
        --orange: #f97316;
        --orange-dark: #ea580c;
        --orange-light: #ffedd5;
        --bg: #fff7ed;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #fed7aa;
        --green: #22c55e;
        --green-light: #dcfce7;
        --red: #ef4444;
        --red-light: #fee2e2;
        --shadow: 0 8px 24px rgba(124, 45, 18, 0.08);
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        max-width: 760px;
        margin: auto;
        min-height: 100vh;
        padding-bottom: 88px;
      }
      header {
        padding: 22px 18px 12px;
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 247, 237, 0.94);
        backdrop-filter: blur(12px);
      }
      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: var(--orange);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 22px;
        box-shadow: 0 6px 16px rgba(249, 115, 22, 0.25);
      }
      h1 {
        font-size: 21px;
        margin: 0;
      }
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-top: 3px;
      }
      main {
        padding: 8px 16px 20px;
      }
      .page {
        display: none;
        animation: fade 0.18s ease;
      }
      .page.active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0.5;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .date-card,
      .summary-card,
      .empty,
      .section-card,
      .calendar-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .date-card {
        padding: 15px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .date-main {
        font-weight: 800;
        text-transform: capitalize;
      }
      .date-small {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .date-input {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px;
        background: #fff;
        color: var(--text);
      }
      .section-card {
        padding: 15px;
        margin-bottom: 13px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      .section-title {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 800;
      }
      .section-icon {
        width: 35px;
        height: 35px;
        border-radius: 11px;
        background: var(--orange-light);
        display: grid;
        place-items: center;
      }
      .count {
        font-size: 12px;
        color: var(--muted);
      }
      .input-row {
        display: flex;
        gap: 8px;
      }
      .idea-input {
        min-width: 0;
        flex: 1;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 12px 13px;
        outline: none;
        background: #fafafa;
      }
      .idea-input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        background: #fff;
      }
      .add-btn,
      .save-btn {
        border: 0;
        background: var(--orange);
        color: #fff;
        border-radius: 12px;
        padding: 11px 14px;
        font-weight: 800;
      }
      .add-btn:active,
      .save-btn:active {
        transform: scale(0.98);
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        margin: 7px 2px 0;
      }
      .items {
        margin-top: 11px;
        display: grid;
        gap: 8px;
      }
      .item {
        border: 1px solid #eee;
        border-radius: 13px;
        padding: 10px 11px;
        background: #fff;
      }
      .item-top {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .item-text {
        flex: 1;
        line-height: 1.4;
        font-size: 14px;
        word-break: break-word;
      }
      .badge {
        font-size: 10px;
        font-weight: 800;
        border-radius: 999px;
        padding: 4px 7px;
        white-space: nowrap;
      }
      .badge.pos {
        background: var(--green-light);
        color: #15803d;
      }
      .badge.neg {
        background: var(--red-light);
        color: #b91c1c;
      }
      .item-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .status-btn,
      .delete-btn {
        border: 0;
        border-radius: 9px;
        padding: 7px 9px;
        font-size: 11px;
        font-weight: 700;
      }
      .status-btn.pos {
        background: var(--green-light);
        color: #15803d;
      }
      .status-btn.neg {
        background: var(--red-light);
        color: #b91c1c;
      }
      .delete-btn {
        background: #f3f4f6;
        color: #6b7280;
        margin-left: auto;
      }
      .save-wrap {
        position: sticky;
        bottom: 77px;
        z-index: 5;
        padding: 10px 0;
        background: linear-gradient(transparent, var(--bg) 25%);
      }
      .save-btn {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        box-shadow: 0 8px 18px rgba(249, 115, 22, 0.2);
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(760px, 100%);
        z-index: 20;
        background: rgba(255, 255, 255, 0.97);
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        backdrop-filter: blur(12px);
      }
      .nav-btn {
        border: 0;
        background: transparent;
        color: #9ca3af;
        padding: 7px 3px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
      }
      .nav-btn span {
        display: block;
        font-size: 21px;
        margin-bottom: 2px;
      }
      .nav-btn.active {
        color: var(--orange);
        background: var(--orange-light);
      }
      .calendar-card {
        padding: 14px;
      }
      .calendar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .month-title {
        text-transform: capitalize;
        font-weight: 900;
        font-size: 17px;
      }
      .icon-btn {
        border: 0;
        background: var(--orange-light);
        color: var(--orange-dark);
        width: 38px;
        height: 38px;
        border-radius: 11px;
        font-size: 18px;
      }
      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
      }
      .weekday {
        text-align: center;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        padding-bottom: 5px;
      }
      .day {
        min-height: 54px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: #fafafa;
        position: relative;
        padding: 7px;
        text-align: left;
      }
      .day.empty {
        background: transparent;
        border: 0;
        box-shadow: none;
      }
      .day-num {
        font-size: 12px;
        font-weight: 800;
      }
      .day.today {
        border-color: var(--orange);
        background: var(--orange-light);
      }
      .day.selected {
        box-shadow: inset 0 0 0 2px var(--orange);
      }
      .dot-row {
        position: absolute;
        bottom: 6px;
        left: 7px;
        display: flex;
        gap: 3px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .dot.green {
        background: var(--green);
      }
      .dot.red {
        background: var(--red);
      }
      .calendar-help {
        font-size: 12px;
        color: var(--muted);
        margin-top: 12px;
        text-align: center;
      }
      .summary-card {
        padding: 16px;
        margin-bottom: 13px;
      }
      .summary-date {
        font-weight: 900;
        font-size: 18px;
        text-transform: capitalize;
      }
      .summary-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 13px;
      }
      .stat {
        border-radius: 13px;
        padding: 12px;
      }
      .stat.green {
        background: var(--green-light);
        color: #15803d;
      }
      .stat.red {
        background: var(--red-light);
        color: #b91c1c;
      }
      .stat strong {
        display: block;
        font-size: 22px;
      }
      .stat span {
        font-size: 11px;
        font-weight: 700;
      }
      .recap-section {
        border-top: 1px solid #eee;
        padding: 13px 0;
      }
      .recap-section:first-child {
        border-top: 0;
      }
      .recap-title {
        font-weight: 800;
        margin-bottom: 8px;
      }
      .recap-item {
        padding: 9px 10px;
        border-radius: 10px;
        background: #fafafa;
        margin-top: 6px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .back-btn {
        border: 0;
        background: var(--orange-light);
        color: var(--orange-dark);
        border-radius: 11px;
        padding: 9px 12px;
        font-weight: 800;
        margin-bottom: 12px;
      }
      .empty {
        padding: 28px 18px;
        text-align: center;
        color: var(--muted);
        box-shadow: none;
      }
      .empty-icon {
        font-size: 32px;
        margin-bottom: 8px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 92px;
        transform: translate(-50%, 20px);
        background: #1f2937;
        color: #fff;
        padding: 11px 15px;
        border-radius: 12px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 50;
        max-width: 90%;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 430px) {
        main {
          padding-left: 12px;
          padding-right: 12px;
        }
        .input-row {
          align-items: stretch;
        }
        .add-btn {
          padding: 10px 11px;
        }
        .day {
          min-height: 48px;
          padding: 6px;
        }
        .date-card {
          align-items: flex-start;
        }
        .date-input {
          width: 130px;
        }
      }
      @media (min-width: 700px) {
        main {
          padding-left: 20px;
          padding-right: 20px;
        }
        .section-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 13px;
        }
        .section-card {
          margin-bottom: 0;
        }
        .save-wrap {
          margin-top: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="header-row">
          <div class="brand">
            <div class="logo">☀️</div>
            <div>
              <h1>Ma Journée</h1>
              <div class="subtitle">Notez, observez, progressez.</div>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section id="page-day" class="page active">
          <div class="date-card">
            <div>
              <div class="date-main" id="selectedDateLabel"></div>
              <div class="date-small">Votre journée</div>
            </div>
            <input id="datePicker" class="date-input" type="date" />
          </div>

          <div class="section-grid">
            <div class="section-card" data-category="religion">
              <div class="section-head">
                <div class="section-title"><span class="section-icon">🕌</span>Religion</div>
                <span class="count" data-count="religion">0</span>
              </div>
              <div class="input-row">
                <input
                  class="idea-input"
                  placeholder="Une idée, un événement…"
                  maxlength="300"
                /><button class="add-btn">Ajouter</button>
              </div>
              <div class="hint">Entrée pour ajouter</div>
              <div class="items"></div>
            </div>
            <div class="section-card" data-category="familiale">
              <div class="section-head">
                <div class="section-title"><span class="section-icon">👨‍👩‍👧</span>Vie familiale</div>
                <span class="count" data-count="familiale">0</span>
              </div>
              <div class="input-row">
                <input
                  class="idea-input"
                  placeholder="Une idée, un événement…"
                  maxlength="300"
                /><button class="add-btn">Ajouter</button>
              </div>
              <div class="hint">Entrée pour ajouter</div>
              <div class="items"></div>
            </div>
            <div class="section-card" data-category="sociale">
              <div class="section-head">
                <div class="section-title"><span class="section-icon">👥</span>Vie mondaine</div>
                <span class="count" data-count="sociale">0</span>
              </div>
              <div class="input-row">
                <input
                  class="idea-input"
                  placeholder="Une idée, un événement…"
                  maxlength="300"
                /><button class="add-btn">Ajouter</button>
              </div>
              <div class="hint">Entrée pour ajouter</div>
              <div class="items"></div>
            </div>
            <div class="section-card" data-category="professionnelle">
              <div class="section-head">
                <div class="section-title">
                  <span class="section-icon">💼</span>Vie professionnelle
                </div>
                <span class="count" data-count="professionnelle">0</span>
              </div>
              <div class="input-row">
                <input
                  class="idea-input"
                  placeholder="Une idée, un événement…"
                  maxlength="300"
                /><button class="add-btn">Ajouter</button>
              </div>
              <div class="hint">Entrée pour ajouter</div>
              <div class="items"></div>
            </div>
          </div>

          <div class="save-wrap">
            <button id="saveDay" class="save-btn">✓ Enregistrer ma journée</button>
          </div>
        </section>

        <section id="page-calendar" class="page">
          <div class="calendar-card">
            <div class="calendar-head">
              <button class="icon-btn" id="prevMonth">‹</button>
              <div class="month-title" id="monthTitle"></div>
              <button class="icon-btn" id="nextMonth">›</button>
            </div>
            <div class="weekdays">
              <div class="weekday">LUN</div>
              <div class="weekday">MAR</div>
              <div class="weekday">MER</div>
              <div class="weekday">JEU</div>
              <div class="weekday">VEN</div>
              <div class="weekday">SAM</div>
              <div class="weekday">DIM</div>
            </div>
            <div class="days" id="calendarDays"></div>
            <div class="calendar-help">Touchez une journée pour voir son récapitulatif.</div>
          </div>
        </section>

        <section id="page-recap" class="page">
          <button class="back-btn" id="backCalendar">← Calendrier</button>
          <div id="recapContent"></div>
        </section>
      </main>

      <nav>
        <button class="nav-btn active" data-page="day"><span>📝</span>Journée</button>
        <button class="nav-btn" data-page="calendar"><span>📅</span>Calendrier</button>
        <button class="nav-btn" data-page="recap"><span>📊</span>Récap</button>
      </nav>
      <div class="toast" id="toast"></div>
    </div>

    <script>
      const KEY = "ma-journee-v1";
      const categories = [
        ["religion", "Religion"],
        ["familiale", "Vie familiale"],
        ["sociale", "Vie mondaine"],
        ["professionnelle", "Vie professionnelle"],
      ];
      let data = JSON.parse(localStorage.getItem(KEY) || "{}");
      let selectedDate = toISO(new Date());
      let calendarDate = new Date();
      let editing = false;

      function toISO(d) {
        return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      }
      function fromISO(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function esc(s) {
        return s.replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }
      function getDay(date = selectedDate) {
        return data[date] || { religion: [], familiale: [], sociale: [], professionnelle: [] };
      }
      function ensureDay(date = selectedDate) {
        if (!data[date])
          data[date] = { religion: [], familiale: [], sociale: [], professionnelle: [] };
        return data[date];
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(data));
      }
      function dateLabel(s) {
        return fromISO(s).toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }
      function shortDate(s) {
        return fromISO(s).toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function renderDay() {
        document.getElementById("datePicker").value = selectedDate;
        document.getElementById("selectedDateLabel").textContent = dateLabel(selectedDate);
        const day = getDay();
        document.querySelectorAll(".section-card").forEach((card) => {
          const cat = card.dataset.category,
            list = day[cat] || [];
          card.querySelector("[data-count]").textContent =
            list.length + " élément" + (list.length > 1 ? "s" : "");
          const items = card.querySelector(".items");
          items.innerHTML = list
            .map(
              (x, i) => `
      <div class="item">
        <div class="item-top"><div class="item-text">${esc(x.text)}</div><span class="badge ${x.status === "positive" ? "pos" : "neg"}">${x.status === "positive" ? "POSITIF" : "NÉGATIF"}</span></div>
        <div class="item-actions">
          <button class="status-btn pos" data-action="status" data-cat="${cat}" data-i="${i}" data-status="positive">🟢 Positif</button>
          <button class="status-btn neg" data-action="status" data-cat="${cat}" data-i="${i}" data-status="negative">🔴 Négatif</button>
          <button class="delete-btn" data-action="delete" data-cat="${cat}" data-i="${i}">Supprimer</button>
        </div>
      </div>`,
            )
            .join("");
        });
      }
      function addItem(cat, input) {
        const text = input.value.trim();
        if (!text) return;
        const day = ensureDay();
        day[cat].push({ text, status: "positive" });
        input.value = "";
        save();
        renderDay();
        input.focus();
        toast("Élément ajouté");
      }
      document.querySelectorAll(".section-card").forEach((card) => {
        const cat = card.dataset.category,
          input = card.querySelector(".idea-input");
        card.querySelector(".add-btn").onclick = () => addItem(cat, input);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            addItem(cat, input);
          }
        });
      });
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-action]");
        if (!b) return;
        const day = ensureDay(),
          cat = b.dataset.cat,
          i = +b.dataset.i;
        if (b.dataset.action === "delete") day[cat].splice(i, 1);
        if (b.dataset.action === "status") day[cat][i].status = b.dataset.status;
        save();
        renderDay();
      });
      document.getElementById("datePicker").onchange = (e) => {
        selectedDate = e.target.value;
        renderDay();
      };
      document.getElementById("saveDay").onclick = () => {
        save();
        toast("Journée enregistrée ✓");
        setTimeout(() => showPage("calendar"), 450);
      };

      function showPage(name) {
        document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
        document.getElementById("page-" + name).classList.add("active");
        document
          .querySelectorAll(".nav-btn")
          .forEach((b) => b.classList.toggle("active", b.dataset.page === name));
        if (name === "calendar") renderCalendar();
        if (name === "recap") renderRecap(selectedDate);
        scrollTo({ top: 0, behavior: "smooth" });
      }
      document
        .querySelectorAll(".nav-btn")
        .forEach((b) => (b.onclick = () => showPage(b.dataset.page)));
      document.getElementById("backCalendar").onclick = () => showPage("calendar");

      function renderCalendar() {
        const y = calendarDate.getFullYear(),
          m = calendarDate.getMonth();
        document.getElementById("monthTitle").textContent = new Date(y, m, 1).toLocaleDateString(
          "fr-FR",
          { month: "long", year: "numeric" },
        );
        const first = (new Date(y, m, 1).getDay() + 6) % 7,
          last = new Date(y, m + 1, 0).getDate();
        let html = "";
        for (let i = 0; i < first; i++) html += '<div class="day empty"></div>';
        for (let d = 1; d <= last; d++) {
          const iso = toISO(new Date(y, m, d)),
            day = data[iso],
            all = day ? categories.flatMap((c) => day[c[0]] || []) : [];
          const pos = all.some((x) => x.status === "positive"),
            neg = all.some((x) => x.status === "negative");
          const today = iso === toISO(new Date()),
            sel = iso === selectedDate;
          html += `<button class="day ${today ? "today " : ""}${sel ? "selected" : ""}" data-date="${iso}">
      <div class="day-num">${d}</div>
      ${all.length ? `<div class="dot-row">${pos ? '<i class="dot green"></i>' : ""}${neg ? '<i class="dot red"></i>' : ""}</div>` : ""}
    </button>`;
        }
        document.getElementById("calendarDays").innerHTML = html;
        document.querySelectorAll(".day[data-date]").forEach(
          (b) =>
            (b.onclick = () => {
              selectedDate = b.dataset.date;
              showPage("recap");
            }),
        );
      }
      document.getElementById("prevMonth").onclick = () => {
        calendarDate.setMonth(calendarDate.getMonth() - 1);
        renderCalendar();
      };
      document.getElementById("nextMonth").onclick = () => {
        calendarDate.setMonth(calendarDate.getMonth() + 1);
        renderCalendar();
      };

      function renderRecap(date) {
        const day = getDay(date),
          all = categories.flatMap((c) => (day[c[0]] || []).map((x) => ({ ...x, cat: c[1] })));
        const pos = all.filter((x) => x.status === "positive").length,
          neg = all.length - pos;
        let body = `
    <div class="summary-card">
      <div class="summary-date">${dateLabel(date)}</div>
      <div class="summary-stats">
        <div class="stat green"><strong>${pos}</strong><span>POSITIF${pos > 1 ? "S" : ""}</span></div>
        <div class="stat red"><strong>${neg}</strong><span>NÉGATIF${neg > 1 ? "S" : ""}</span></div>
      </div>
    </div>`;
        if (!all.length) {
          body += `<div class="empty"><div class="empty-icon">🌱</div>Aucune note pour cette journée.<br>Commencez à la remplir depuis l’onglet Journée.</div>`;
        } else {
          body += `<div class="summary-card">`;
          categories.forEach(([key, label]) => {
            const list = day[key] || [];
            if (list.length)
              body += `<div class="recap-section"><div class="recap-title">${label} <span class="count">(${list.length})</span></div>${list.map((x) => `<div class="recap-item"><span>${esc(x.text)}</span><span class="badge ${x.status === "positive" ? "pos" : "neg"}">${x.status === "positive" ? "🟢" : "🔴"}</span></div>`).join("")}</div>`;
          });
          body += `</div>`;
          body += `<button class="save-btn" style="margin-top:2px" id="editSelected">✎ Modifier cette journée</button>`;
        }
        document.getElementById("recapContent").innerHTML = body;
        const edit = document.getElementById("editSelected");
        if (edit)
          edit.onclick = () => {
            showPage("day");
            renderDay();
          };
      }
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(window._toast);
        window._toast = setTimeout(() => t.classList.remove("show"), 1800);
      }
      renderDay();
    </script>
  </body>
</html>
